name: Build CatCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CatCore APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract CatCore ZIP
        shell: bash
        run: |
          ZIP_PATH=$(find . -maxdepth 4 \
            -type f -iname 'CatCore*.zip' \
            -not -path './.git/*' \
            -print -quit)

          if [ -n "$ZIP_PATH" ]; then
            echo "Found archive: $ZIP_PATH"
            mkdir -p .catcore-source
            unzip -oq "$ZIP_PATH" -d .catcore-source
          else
            echo "No CatCore ZIP found. Checking source folders..."
          fi

      - name: Detect Gradle Project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=""

          for DIR in ".catcore-source/CatCore" ".catcore-source" "." "CatCore"; do
            if [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/settings.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle project not found!"
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build CatCore Debug APK
        run: |
          gradle \
            -p "${{ steps.locate.outputs.project_dir }}" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          find "${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk" \
            -type f -name "*.apk"

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
