
name: Build CatCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CatCore APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP Archives
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/catcore-source"

          COUNT=0

          while IFS= read -r -d '' FILE; do
            COUNT=$((COUNT + 1))
            echo "Extracting $FILE"
            mkdir -p "$RUNNER_TEMP/catcore-source/$COUNT"
            unzip -oq "$FILE" \
              -d "$RUNNER_TEMP/catcore-source/$COUNT"
          done < <(
            find . -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          echo "Extracted $COUNT ZIP files"

      - name: Find Android Project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT=""

          for ROOT in \
            "$RUNNER_TEMP/catcore-source" \
            "$GITHUB_WORKSPACE"
          do
            while IFS= read -r -d '' FILE; do
              DIR="$(dirname "$FILE")"

              if [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then
                PROJECT="$DIR"
                break 2
              fi
            done < <(
              find "$ROOT" -type f \
                \( -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \) \
                -not -path '*/.git/*' -print0
            )
          done

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found"
            find "$RUNNER_TEMP/catcore-source" \
              -type f | head -100
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle \
            -p "${{ steps.locate.outputs.project_dir }}" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find \
            "${{ steps.locate.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK not generated"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
          
