
name: Build CatCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect CatCore Project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "CatCore/settings.gradle.kts" ] || [ -f "CatCore/settings.gradle" ]; then
            echo "project_dir=CatCore" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Gradle project not found!"
            exit 1
          fi

      - name: Check QEMU and Firmware
        run: |
          DIR="${{ steps.project.outputs.project_dir }}"

          if [ ! -f "$DIR/app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so" ]; then
            echo "::warning::QEMU engine is missing"
          fi

          if [ ! -f "$DIR/app/src/main/assets/firmware/OVMF_CODE.fd" ]; then
            echo "::warning::UEFI firmware is missing"
          fi

      - name: Build CatCore Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
