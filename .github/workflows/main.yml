
name: CatCore QEMU ARM64 - GZIP Fix V5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout CatCore
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and licenses
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/tmp/licenses.log 2>&1 || true
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install QEMU build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils

      - name: Bundle QEMU for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          echo 'CATCORE GZIP FIX V5 - Packages.gz (not Packages.xz)'
          cat > /tmp/bundle.py <<'PY'
          import gzip
          import hashlib
          import re
          import shutil
          import subprocess
          import tempfile
          import time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          REPOS = [
              'https://packages.termux.dev/apt/termux-main',
              'https://packages-cf.termux.dev/apt/termux-main',
              'https://termux.librehat.com/apt/termux-main',
          ]
          INDEX = '/dists/stable/main/binary-aarch64/Packages.gz'
          PREFIX = Path('data/data/com.termux/files/usr')
          SYSTEM = {
              'libc.so', 'libdl.so', 'libm.so', 'liblog.so',
              'libandroid.so', 'libz.so', 'libstdc++.so',
              'libEGL.so', 'libGLESv2.so', 'libGLESv3.so',
              'libOpenSLES.so', 'libvulkan.so',
          }

          def fetch(url):
              last = None
              for n in range(3):
                  try:
                      with urlopen(url, timeout=90) as r:
                          return r.read()
                  except Exception as error:
                      last = error
                      time.sleep(n + 1)
              raise RuntimeError(f'Download failed {url}: {last}')

          def index_parse(data):
              packages, provides = {}, {}
              for paragraph in data.decode('utf-8').split('\n\n'):
                  fields, last = {}, None
                  for line in paragraph.splitlines():
                      if line.startswith(' ') and last:
                          fields[last] += ' ' + line.strip()
                      elif ': ' in line:
                          last, value = line.split(': ', 1)
                          fields[last] = value
                  if fields.get('Package'):
                      packages[fields['Package']] = fields
              for name, fields in packages.items():
                  for entry in fields.get('Provides', '').split(','):
                      alias = re.split(r'[ (]', entry.strip())[0]
                      if alias:
                          provides.setdefault(alias, name)
              return packages, provides

          def dependencies(fields, packages, provides):
              for field in ('Pre-Depends', 'Depends'):
                  for choices in fields.get(field, '').split(','):
                      if not choices.strip():
                          continue
                      for choice in choices.split('|'):
                          name = re.split(r'[ (\[]', choice.strip())[0]
                          resolved = name if name in packages else provides.get(name)
                          if resolved:
                              yield resolved
                              break

          def shell(*args):
              return subprocess.check_output(args, text=True).strip()

          def elf(path):
              if not path.is_file():
                  return False
              with path.open('rb') as f:
                  return f.read(4) == b'\x7fELF'

          def needed(path):
              return shell('patchelf', '--print-needed', str(path)).splitlines()

          def shortname(name):
              match = re.fullmatch(r'(lib.+?\.so)(?:\.[0-9][0-9.]*)?', name)
              return match.group(1) if match else None

          def main():
              repo = None
              catalog = None
              for candidate in REPOS:
                  try:
                      catalog = gzip.decompress(fetch(candidate + INDEX))
                      repo = candidate
                      break
                  except Exception as error:
                      print('Mirror failed:', candidate, error, flush=True)
              if catalog is None:
                  raise RuntimeError('No reachable Packages.gz repository')

              packages, provides = index_parse(catalog)
              queue = ['qemu-system-x86-64-headless', 'qemu-common']
              chosen = {}
              while queue:
                  name = queue.pop(0)
                  if name in chosen:
                      continue
                  if name not in packages:
                      raise RuntimeError('Required package missing: ' + name)
                  chosen[name] = packages[name]
                  queue.extend(dependencies(packages[name], packages, provides))

              native = Path('app/src/main/jniLibs/arm64-v8a')
              firmware = Path('app/src/main/assets/firmware')
              native.mkdir(parents=True, exist_ok=True)
              firmware.mkdir(parents=True, exist_ok=True)

              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory) / 'root'
                  root.mkdir()

                  for number, (name, fields) in enumerate(chosen.items(), 1):
                      path = fields['Filename'].lstrip('/')
                      if not path.startswith('pool/'):
                          raise RuntimeError('Unexpected package path: ' + path)

                      data = fetch(repo + '/' + quote(path, safe='/'))
                      if hashlib.sha256(data).hexdigest().lower() != fields.get('SHA256', '').lower():
                          raise RuntimeError('Checksum failed: ' + name)

                      deb = Path(directory) / 'package.deb'
                      deb.write_bytes(data)
                      subprocess.run(
                          ['dpkg-deb', '-x', str(deb), str(root)],
                          check=True
                      )
                      deb.unlink()
                      print(f'[{number}/{len(chosen)}] {name}', flush=True)

                  prefix = root / PREFIX
                  executable = prefix / 'bin/qemu-system-x86_64'

                  if not elf(executable):
                      raise RuntimeError('QEMU ARM64 executable missing')

                  destination = native / 'libqemu-system-x86_64.so'
                  shutil.copy2(executable, destination)

                  sources = {}
                  for p in (prefix / 'lib').rglob('*'):
                      if p.is_file() and elf(p) and shortname(p.name):
                          sources[p.name] = p

                  def source_for(name):
                      if name in sources:
                          return sources[name]
                      short = shortname(name)
                      if short in sources:
                          return sources[short]
                      return next(
                          (p for n, p in sources.items() if shortname(n) == short),
                          None
                      )

                  pending = [destination]
                  files = {destination.name: destination}
                  replacements = {}

                  while pending:
                      target = pending.pop()
                      for dep in needed(target):
                          if dep in SYSTEM or dep in replacements:
                              continue

                          source = source_for(dep)
                          if source is None:
                              raise RuntimeError(
                                  f'Missing QEMU dependency: {dep} required by {target.name}'
                              )

                          new = shortname(source.name)
                          if new in SYSTEM:
                              if new != dep:
                                  raise RuntimeError('Incompatible system library: ' + dep)
                              continue

                          replacements[dep] = new
                          if new not in files:
                              dest = native / new
                              shutil.copy2(source, dest)
                              files[new] = dest
                              pending.append(dest)

                  for target in files.values():
                      subprocess.run(
                          ['patchelf', '--remove-rpath', str(target)],
                          check=True
                      )

                      for dep in needed(target):
                          new = replacements.get(dep)
                          if new and new != dep:
                              subprocess.run(
                                  [
                                      'patchelf',
                                      '--replace-needed',
                                      dep,
                                      new,
                                      str(target)
                                  ],
                                  check=True
                              )

                      if target != destination:
                          subprocess.run(
                              ['patchelf', '--set-soname', target.name, str(target)],
                              check=True
                          )

                  absent = sorted({
                      dep
                      for target in files.values()
                      for dep in needed(target)
                      if dep not in SYSTEM and dep not in files
                  })

                  if absent:
                      raise RuntimeError(
                          'Unresolved libraries: ' + ', '.join(absent)
                      )

                  if shell(
                      'patchelf',
                      '--print-interpreter',
                      str(destination)
                  ) != '/system/bin/linker64':
                      raise RuntimeError(
                          'QEMU has incompatible Android interpreter'
                      )

                  if 'AArch64' not in shell(
                      'readelf', '-h', str(destination)
                  ):
                      raise RuntimeError('QEMU is not ARM64')

                  roms = prefix / 'share/qemu'
                  code = roms / 'edk2-x86_64-code.fd'
                  variables = roms / 'edk2-i386-vars.fd'

                  if not code.is_file() or not variables.is_file():
                      raise RuntimeError('OVMF boot firmware missing')

                  shutil.copy2(code, firmware / 'OVMF_CODE.fd')
                  shutil.copy2(variables, firmware / 'OVMF_VARS.fd')
                  shutil.copytree(
                      roms,
                      firmware / 'qemu',
                      dirs_exist_ok=True
                  )

                  Path('QEMU_PACKAGE_MANIFEST.txt').write_text(
                      '\n'.join(
                          name + ' ' + fields.get('Version', '')
                          for name, fields in chosen.items()
                      ) + '\n'
                  )

                  print(
                      'QEMU bundled:',
                      len(files),
                      'ELF files',
                      flush=True
                  )

          if __name__ == '__main__':
              main()
          PY

          python3 /tmp/bundle.py

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apks = list(
              Path('app/build/outputs/apk/debug').glob('*.apk')
          )

          if not apks:
              raise SystemExit('APK was not built')

          with ZipFile(apks[0]) as apk:
              names = set(apk.namelist())
              required = {
                  'lib/arm64-v8a/libqemu-system-x86_64.so',
                  'assets/firmware/OVMF_CODE.fd',
                  'assets/firmware/OVMF_VARS.fd',
              }

              if required - names:
                  raise SystemExit(
                      'Missing APK assets: ' + str(required - names)
                  )

              if not any(
                  'assets/firmware/qemu/' + name in names
                  for name in ('bios.bin', 'bios-256k.bin')
              ):
                  raise SystemExit('Missing QEMU BIOS')

          print('QEMU and firmware packaged')
          print('Windows boot still requires device testing')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-QEMU-ARM64-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            QEMU_PACKAGE_MANIFEST.txt
          if-no-files-found: error

            
