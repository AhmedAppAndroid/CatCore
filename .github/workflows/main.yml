
name: Build CatCore with QEMU engine (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDK_MANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' \
              2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDK_MANAGER" ] || [ ! -x "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDK_MANAGER" \
            --sdk_root="$SDK_ROOT" --licenses \
            > /tmp/licenses.log 2>&1 || true

          tail -n 12 /tmp/licenses.log

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils

      - name: Download and package QEMU ARM64
        run: |
          python3 tools/bundle_qemu.py --project .

      - name: Build CatCore APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify QEMU engine in APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apks = list(
              Path('app/build/outputs/apk/debug')
              .glob('*.apk')
          )

          if not apks:
              raise SystemExit('APK not found')

          required = {
              'lib/arm64-v8a/libqemu-system-x86_64.so',
              'assets/firmware/OVMF_CODE.fd',
              'assets/firmware/OVMF_VARS.fd',
          }

          with zipfile.ZipFile(apks[0]) as apk:
              names = set(apk.namelist())
              missing = required - names

              if not any(
                  f'assets/firmware/qemu/{x}' in names
                  for x in ('bios.bin', 'bios-256k.bin')
              ):
                  missing.add('QEMU BIOS')

              if missing:
                  raise SystemExit(
                      f'Missing QEMU files: {sorted(missing)}'
                  )

          print('QEMU files packaged successfully')
          PY

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-QEMU-ARM64-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            QEMU_PACKAGE_MANIFEST.txt
          retention-days: 14
          
