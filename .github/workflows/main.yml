name: Build CatCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect Project Folder
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "CatCore/settings.gradle.kts" ]; then
            echo "project_dir=CatCore" >> "$GITHUB_OUTPUT"
            echo "PROJECT_DIR=CatCore" >> "$GITHUB_ENV"
          else
            echo "Project files not found!"
            exit 1
          fi

      - name: Check QEMU Files
        run: |
          test -f "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so" || echo "::warning::QEMU engine missing"
          test -f "$PROJECT_DIR/app/src/main/assets/firmware/OVMF_CODE.fd" || echo "::warning::UEFI firmware missing"

      - name: Build CatCore APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-APK
          path: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
