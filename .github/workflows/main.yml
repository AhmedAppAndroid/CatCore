
name: Build CatCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CatCore APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract All ZIP Archives
        shell: bash
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/catcore-archives"
          mkdir -p "$DEST"

          COUNT=0

          while IFS= read -r -d '' FILE; do
            COUNT=$((COUNT + 1))
            echo "Extracting: $FILE"

            unzip -oq "$FILE" -d "$DEST/archive-$COUNT"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

          echo "ZIP archives extracted: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No ZIP archives found"
          fi

      - name: Find Android Project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          for ROOT in \
            "$RUNNER_TEMP/catcore-archives" \
            "$GITHUB_WORKSPACE"
          do
            while IFS= read -r -d '' SETTINGS; do

              DIR="$(dirname "$SETTINGS")"

              if [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then

                PROJECT_DIR="$DIR"
                break 2
              fi

            done < <(
              find "$ROOT" -type f \
                \( -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \) \
                -not -path '*/.git/*' \
                -not -path '*/build/*' \
                -print0
            )
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found"

            echo "ZIP files:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip'

            echo "Gradle files:"
            find "$RUNNER_TEMP/catcore-archives" \
              "$GITHUB_WORKSPACE" \
              -type f -name 'settings.gradle*' \
              -not -path '*/.git/*'

            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build CatCore APK
        shell: bash
        run: |
          gradle \
            -p "${{ steps.locate.outputs.project_dir }}" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK_DIR="${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug"

          if ! ls "$APK_DIR"/*.apk >/dev/null 2>&1; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
