
name: Build CatCore with QEMU engine (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install ELF patching dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils

      - name: Fetch and package QEMU + its ARM64 libraries and UEFI ROMs
        run: python3 tools/bundle_qemu.py --project .

      - name: Compile Android app
        run: gradle :app:assembleDebug --no-daemon

      - name: Fail if engine or firmware is absent from produced APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = next(Path('app/build/outputs/apk/debug').glob('*.apk'))

          required = {
              'lib/arm64-v8a/libqemu-system-x86_64.so',
              'assets/firmware/OVMF_CODE.fd',
              'assets/firmware/OVMF_VARS.fd',
          }

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = required - names

              if not any(
                  f'assets/firmware/qemu/{x}' in names
                  for x in ('bios.bin', 'bios-256k.bin')
              ):
                  missing.add('assets/firmware/qemu/bios.bin (or bios-256k.bin)')

              if missing:
                  raise SystemExit('INCOMPLETE APK: ' + repr(sorted(missing)))

              print('QEMU engine and firmware packaged.')
              print('Android runtime boot is not yet verified.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CatCore-ARM64-QEMU-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            QEMU_PACKAGE_MANIFEST.txt
          retention-days: 14
          
