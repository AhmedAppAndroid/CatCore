name: Build CatCore (engine + APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_VERSION: "9.2.0"
  ENGINE_REV: "r1"   # change r1 to r2, r3... to force the engine to be rebuilt

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build the QEMU engine natively on an arm64 runner (free for PUBLIC repos).
  #    Result: one static file, libqemu-system-x86_64.so. It is cached, so only
  #    the first run is slow.
  # ---------------------------------------------------------------------------
  engine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached engine
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out
          key: qemu-engine-${{ env.QEMU_VERSION }}-${{ env.ENGINE_REV }}

      - name: Write engine build script
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cat > build-engine.sh <<'SCRIPT'
          #!/bin/sh
          # Builds a fully static qemu-system-x86_64 for 64-bit ARM Linux/Android (musl, no shared libraries needed)
          set -eux

          apk add --no-cache build-base linux-headers python3 py3-pip py3-setuptools py3-wheel \
            pkgconf curl tar xz meson coreutils grep sed gawk diffutils findutils \
            glib-dev glib-static pcre2-dev libffi-dev zlib-dev zlib-static musl-libintl pixman-dev
          apk add --no-cache ninja || apk add --no-cache samurai
          for p in pixman-static pcre2-static libffi-static gettext-static; do
            apk add --no-cache "$p" || echo "package $p not available, continuing"
          done

          test -f /usr/lib/libglib-2.0.a || { echo "glib static library missing"; exit 1; }
          test -f /usr/lib/libz.a || { echo "zlib static library missing"; exit 1; }

          # pixman static (build from source only if the distro package has no .a)
          if [ ! -f /usr/lib/libpixman-1.a ]; then
            curl -fL https://www.cairographics.org/releases/pixman-0.43.4.tar.gz | tar xz
            ( cd pixman-0.43.4 && meson setup b --prefix=/usr --libdir=lib --default-library=static \
                -Dtests=disabled -Ddemos=disabled && ninja -C b install )
          fi

          # libslirp static (user-mode networking for the guest)
          curl -fL https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.8.0/libslirp-v4.8.0.tar.gz | tar xz
          ( cd libslirp-v4.8.0 && meson setup b --prefix=/usr --libdir=lib --default-library=static && ninja -C b install )

          # QEMU itself: x86_64 system emulator, TCG only, VNC display, user networking
          curl -fL "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" | tar xJ
          mkdir -p "qemu-${QEMU_VERSION}/build"
          cd "qemu-${QEMU_VERSION}/build"
          ../configure \
            --static \
            --target-list=x86_64-softmmu \
            --without-default-features \
            --enable-tcg --enable-vnc --enable-slirp \
            --disable-werror
          ninja qemu-system-x86_64
          strip -s qemu-system-x86_64
          ls -l qemu-system-x86_64
          ldd qemu-system-x86_64 2>&1 | head -3 || true

          mkdir -p /work/engine-out
          cp qemu-system-x86_64 /work/engine-out/libqemu-system-x86_64.so
          chmod 755 /work/engine-out/libqemu-system-x86_64.so
          SCRIPT

      - name: Build static QEMU (Alpine arm64 container)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p engine-out
          docker run --rm -e QEMU_VERSION -v "$PWD:/work" -w /work alpine:3.21 sh /work/build-engine.sh

      # uploaded before the tests, so you can still download the file if a test fails
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-engine
          path: engine-out/libqemu-system-x86_64.so
          if-no-files-found: error

      - name: Smoke test (same command line the app uses)
        run: |
          set -x
          E="$PWD/engine-out/libqemu-system-x86_64.so"
          chmod +x "$E"
          "$E" --version
          "$E" -device help > devices.txt 2>&1 || true
          for d in nvme e1000e qemu-xhci usb-tablet usb-kbd ich9-ahci ide-cd VGA; do
            grep -q "name \"$d\"" devices.txt || { echo "missing device: $d"; exit 1; }
          done
          "$E" -netdev help > nets.txt 2>&1 || true
          grep -qw user nets.txt || { echo "user networking missing"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq ovmf
          D=/usr/share/OVMF
          if [ -f $D/OVMF_CODE_4M.fd ]; then C=$D/OVMF_CODE_4M.fd; V=$D/OVMF_VARS_4M.fd; else C=$D/OVMF_CODE.fd; V=$D/OVMF_VARS.fd; fi
          cp -L "$C" code.fd; cp -L "$V" vars.fd; truncate -s 1G disk.img
          "$E" -machine q35 -cpu max -accel tcg,thread=multi -smp 2 -m 1024 -nodefaults \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=code.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive if=none,id=hd0,format=raw,file=disk.img -device nvme,drive=hd0,serial=catcore0 \
            -device qemu-xhci -device usb-tablet -device usb-kbd \
            -device VGA,romfile= \
            -netdev user,id=n0 -device e1000e,netdev=n0,romfile= \
            -rtc base=localtime -display none -vnc 127.0.0.1:0 > qemu.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            kill -0 $PID 2>/dev/null || break
            if (exec 3<>/dev/tcp/127.0.0.1/5900) 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          cat qemu.log
          [ "$ok" = 1 ] || { echo "VNC display never came up"; exit 1; }
          echo "smoke test passed"

  # ---------------------------------------------------------------------------
  # 2) Build the APK with the engine and the UEFI firmware inside.
  # ---------------------------------------------------------------------------
  apk:
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets tagged builds publish a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Get the QEMU engine from the engine job
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qemu-engine
          path: app/src/main/jniLibs/arm64-v8a

      - name: Add OVMF firmware
        run: |
          F=app/src/main/assets/firmware
          mkdir -p $F app/src/main/jniLibs/arm64-v8a
          if [ ! -f $F/OVMF_CODE.fd ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ovmf
            D=/usr/share/OVMF
            if [ -f $D/OVMF_CODE_4M.fd ]; then C=$D/OVMF_CODE_4M.fd; V=$D/OVMF_VARS_4M.fd
            else C=$D/OVMF_CODE.fd; V=$D/OVMF_VARS.fd; fi
            cp -L $C $F/OVMF_CODE.fd
            cp -L $V $F/OVMF_VARS.fd
          fi

      - name: Check engine and firmware are inside
        run: |
          ls -l app/src/main/jniLibs/arm64-v8a app/src/main/assets/firmware
          test -f app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so || echo "::warning::QEMU engine missing, the APK cannot boot Windows"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CatCore-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CatCore-debug-apk
          path: CatCore-debug.apk

      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CatCore-debug.apk
